<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: WeChat Green to Modern Cyan/Teal -->
    <linearGradient id="wefeed-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07C160" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Signal Wave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#047857" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#wefeed-bg)" filter="url(#shadow)" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="140" cy="140" r="180" fill="#FFFFFF" opacity="0.12" />

  <!-- Stylized WeFeed Symbol: Chat Bubble Silhouette combined with RSS Broadcast Arcs -->
  <g transform="translate(16, 8)" filter="url(#glow)">
    <!-- Base RSS Node / Message Seed -->
    <circle cx="148" cy="344" r="34" fill="#FFFFFF" />

    <!-- Inner Wave / Lower "W" Arch -->
    <path d="M 148 244 A 100 100 0 0 1 248 344"
          fill="none"
          stroke="url(#wave-grad)"
          stroke-width="32"
          stroke-linecap="round" />

    <!-- Outer Wave / Upper "W" Crest -->
    <path d="M 148 164 A 180 180 0 0 1 328 344"
          fill="none"
          stroke="url(#wave-grad)"
          stroke-width="32"
          stroke-linecap="round" />

    <!-- Dynamic Stream Spark (Representing Feeds & WeChat Content) -->
    <path d="M 288 172 C 340 180 376 216 384 268 C 392 240 376 200 348 184 C 330 174 308 170 288 172 Z"
          fill="#FFFFFF"
          opacity="0.4" />
    
    <!-- Top-Right Accent Antenna Dot -->
    <circle cx="344" cy="156" r="16" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>