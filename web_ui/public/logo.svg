<svg viewBox="0 0 512 512" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cupertino Emerald Gradient -->
    <linearGradient id="wf-pure-grad" x1="140" y1="380" x2="380" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Mathematically and optically centered at (256, 256) -->
  <!-- Total bounding box: 240px x 240px, perfectly balanced -->
  <g transform="translate(4, 2)">
    <!-- Pure Solid Harmonic Anchor (Origin Node) -->
    <circle cx="166" cy="346" r="30" fill="url(#wf-pure-grad)" />

    <!-- Inner Concentric Wave (R=98, Stroke=36) -->
    <path d="M 166 248 A 98 98 0 0 1 264 346"
          stroke="url(#wf-pure-grad)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Outer Concentric Wave (R=186, Stroke=36) -->
    <path d="M 166 160 A 186 186 0 0 1 352 346"
          stroke="url(#wf-pure-grad)"
          stroke-width="36"
          stroke-linecap="round" />
  </g>
</svg>