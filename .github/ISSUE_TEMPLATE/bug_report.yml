name: Bug 反馈
description: 反馈运行报错、抓取异常或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明遇到了什么问题，以及如何复现（可直接拖拽上传截图）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错日志
      description: 粘贴容器或控制台的关键报错输出
      render: shell

  - type: input
    id: env
    attributes:
      label: 运行环境与版本
      placeholder: "例如：Docker Compose / v1.5.5"
