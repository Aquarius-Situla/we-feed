name: 功能建议
description: 提出新功能或现有功能改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 在什么使用场景下遇到了不便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望效果
      description: 希望增加什么功能或如何改进？
    validations:
      required: true
