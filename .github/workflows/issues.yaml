name: Issue Automation

permissions:
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  issue-handler:
    runs-on: ubuntu-latest
    steps:
      # 1. 自动打标签：根据 Issue 标题与关键词智能补充标签
      - name: Auto Label Issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const currentLabels = (context.payload.issue.labels || []).map(l => l.name);
            const labelsToAdd = [];

            if ((title.includes('[bug]') || title.includes('bug') || title.includes('报错') || title.includes('失败') || title.includes('异常')) && !currentLabels.includes('bug')) {
              labelsToAdd.push('bug');
            } else if ((title.includes('[feature]') || title.includes('feature') || title.includes('feat') || title.includes('建议') || title.includes('需求')) && !currentLabels.includes('enhancement')) {
              labelsToAdd.push('enhancement');
            } else if ((title.includes('doc') || title.includes('文档')) && !currentLabels.includes('documentation')) {
              labelsToAdd.push('documentation');
            }

            if (currentLabels.length === 0 && labelsToAdd.length === 0) {
              labelsToAdd.push('triage');
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labelsToAdd
              });
            }

      # 2. 社区互动：当标记为 help wanted 时自动友好回复（使用内置 GITHUB_TOKEN，彻底杜绝凭证缺失报错）
      - name: Reply to Help Wanted
        if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'help wanted'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const user = context.payload.issue.user.login;
            const body = `Hello @${user}. We totally like your proposal/feedback, welcome PR!\n你好 @${user}，感谢你的提议/反馈，欢迎提交 PR！`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: body
            });
